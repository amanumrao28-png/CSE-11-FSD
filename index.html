<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch</title>
    <style>
        table{
            border:2px solid black;
            width:80vw;

        }
        th,td{
            border:1px solid black;
            padding:10px;
        }
    </style>
    <script>
        const url = "https://dummyjson.com/products?limit=100&skip=2";
        async function loadProducts(){
            try{
                const res=await fetch(url);
                let rows='';
                console.log("res=",res);
                const data= await res.json();
                console.log("data=",data);
                const currency=await fetch("https://v6.exchangerate-api.com/v6/30b3ccdb99349318ed66e8a1/pair/USD/INR");
                const usdtoInr=await currency.json();
                const usdtoInrRate=usdtoInr.conversion_rate;

                data.products.map((product,index)=>{
                    rows+=`
                    <tr>
                        <td>${index+1}</td>
                        <td>${product.title}</td>
                        <td><img src=${product.images[0]} width="100px" height="100px"/></td>
                        <td>${product.category}</td>
                        <td>${product.rating}</td>

                        <td>${(product.price * usdtoInrRate).toFixed(2)}</td>
                        <td>${product.stock}</td>
                    </tr>`
                })
                 const ele=document.getElementById('data');
                 ele.innerHTML=rows;
            }
            catch(error){
                console.log("error",error);
            }
            
        }
        loadProducts();
    </script>
</head>
<body>
     <h1><center>List of Products</center></h1>
     <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Image </th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>

        </thead>
        <tbody id="data">

        </tbody>
     </table>
</body>
</html>
